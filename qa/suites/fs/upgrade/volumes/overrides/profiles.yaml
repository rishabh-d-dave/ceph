# Optional overrides for volumes_upgrade. Profiles and which subvolume gets
# which profile default in qa/tasks/volumes_upgrade.py (DEFAULT_PROFILES /
# DEFAULT_SUBVOLUMES); uncomment/extend below only to override.
overrides:
  install:
    # setfacl/getfacl, for the acl attribute
    extra_system_packages:
      rpm:
        - acl
      deb:
